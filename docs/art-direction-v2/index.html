<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Execution Labs — Art Direction V2 Review</title>
    <link rel="stylesheet" href="./review.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="wordmark" href="#top">EXECUTION LABS <span>/ ART DIRECTION V2</span></a>
      <nav aria-label="Review navigation">
        <a href="#overview">OVERVIEW</a>
        <a href="#directions">A / B / C</a>
      </nav>
    </header>

    <main id="top">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">PHONE REVIEW</p>
        <h1 id="page-title">Art Direction V2</h1>
      </section>

      <section id="overview" class="review-section" aria-labelledby="overview-title">
        <div class="section-head">
          <p class="eyebrow">OVERVIEW</p>
          <h2 id="overview-title">A / B / C</h2>
        </div>

        <button class="image-button image-button-wide" type="button" data-image="review-package/contact-sheet.png" data-alt="Direction A, Direction B, and Direction C contact sheet">
          <img src="./review-package/contact-sheet.png" alt="Direction A, Direction B, and Direction C contact sheet" fetchpriority="high" />
        </button>

        <div class="comparison-grid">
          <button class="image-button" type="button" data-image="review-package/desktop-comparison.png" data-alt="Desktop comparison: Direction A, Direction B, Direction C">
            <img src="./review-package/desktop-comparison.png" alt="Desktop comparison: Direction A, Direction B, Direction C" loading="lazy" />
          </button>
          <button class="image-button" type="button" data-image="review-package/mobile-comparison.png" data-alt="Mobile comparison: Direction A, Direction B, Direction C">
            <img src="./review-package/mobile-comparison.png" alt="Mobile comparison: Direction A, Direction B, Direction C" loading="lazy" />
          </button>
        </div>
      </section>

      <section id="directions" class="review-section directions" aria-label="Individual direction screenshots">
        <article class="direction" id="direction-a">
          <h2>DIRECTION A</h2>
          <div class="shot-grid">
            <button class="image-button" type="button" data-image="direction-a/hero-1440x900.png" data-alt="Direction A desktop hero">
              <img src="./direction-a/hero-1440x900.png" alt="Direction A desktop hero" loading="lazy" />
            </button>
            <button class="image-button" type="button" data-image="direction-a/selected-work-1440x900.png" data-alt="Direction A desktop Selected Work">
              <img src="./direction-a/selected-work-1440x900.png" alt="Direction A desktop Selected Work" loading="lazy" />
            </button>
            <button class="image-button phone-shot" type="button" data-image="direction-a/hero-390x844.png" data-alt="Direction A mobile hero">
              <img src="./direction-a/hero-390x844.png" alt="Direction A mobile hero" loading="lazy" />
            </button>
            <button class="image-button phone-shot" type="button" data-image="direction-a/selected-work-390x844.png" data-alt="Direction A mobile Selected Work">
              <img src="./direction-a/selected-work-390x844.png" alt="Direction A mobile Selected Work" loading="lazy" />
            </button>
          </div>
        </article>

        <article class="direction" id="direction-b">
          <h2>DIRECTION B</h2>
          <div class="shot-grid">
            <button class="image-button" type="button" data-image="direction-b/hero-1440x900.png" data-alt="Direction B desktop hero">
              <img src="./direction-b/hero-1440x900.png" alt="Direction B desktop hero" loading="lazy" />
            </button>
            <button class="image-button" type="button" data-image="direction-b/selected-work-1440x900.png" data-alt="Direction B desktop Selected Work">
              <img src="./direction-b/selected-work-1440x900.png" alt="Direction B desktop Selected Work" loading="lazy" />
            </button>
            <button class="image-button phone-shot" type="button" data-image="direction-b/hero-390x844.png" data-alt="Direction B mobile hero">
              <img src="./direction-b/hero-390x844.png" alt="Direction B mobile hero" loading="lazy" />
            </button>
            <button class="image-button phone-shot" type="button" data-image="direction-b/selected-work-390x844.png" data-alt="Direction B mobile Selected Work">
              <img src="./direction-b/selected-work-390x844.png" alt="Direction B mobile Selected Work" loading="lazy" />
            </button>
          </div>
        </article>

        <article class="direction" id="direction-c">
          <h2>DIRECTION C</h2>
          <div class="shot-grid">
            <button class="image-button" type="button" data-image="direction-c/hero-1440x900.png" data-alt="Direction C desktop hero">
              <img src="./direction-c/hero-1440x900.png" alt="Direction C desktop hero" loading="lazy" />
            </button>
            <button class="image-button" type="button" data-image="direction-c/selected-work-1440x900.png" data-alt="Direction C desktop Selected Work">
              <img src="./direction-c/selected-work-1440x900.png" alt="Direction C desktop Selected Work" loading="lazy" />
            </button>
            <button class="image-button phone-shot" type="button" data-image="direction-c/hero-390x844.png" data-alt="Direction C mobile hero">
              <img src="./direction-c/hero-390x844.png" alt="Direction C mobile hero" loading="lazy" />
            </button>
            <button class="image-button phone-shot" type="button" data-image="direction-c/selected-work-390x844.png" data-alt="Direction C mobile Selected Work">
              <img src="./direction-c/selected-work-390x844.png" alt="Direction C mobile Selected Work" loading="lazy" />
            </button>
          </div>
        </article>
      </section>
    </main>

    <dialog class="viewer" aria-label="Full-resolution image viewer">
      <button class="viewer-close" type="button" aria-label="Close image viewer">CLOSE</button>
      <img class="viewer-image" alt="" />
    </dialog>

    <script src="./review.js"></script>
  </body>
</html>
